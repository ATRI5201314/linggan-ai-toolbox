<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI取名神器 - 宝宝起名/宠物取名/店铺命名 | 灵感岛</title>
  <meta name="description" content="免费的AI取名神器，支持宝宝起名、宠物取名、店铺命名，古风、现代、可爱、大气多种风格，寓意吉祥又好听。">
  <meta name="keywords" content="取名,宝宝起名,宠物名字,店铺取名,名字生成器,AI取名,起名神器">
  <link rel="canonical" href="/tools/name.html">
  <link rel="stylesheet" href="/assets/css/style.css?v=20261116b">
  <script type="application/ld+json">
  {"@context":"https://schema.org","@type":"SoftwareApplication","name":"AI取名神器","applicationCategory":"UtilitiesApplication","operatingSystem":"Web","offers":{"@type":"Offer","price":"0"}}
  </script>
</head>
<body data-tool="name">
  <header class="site-header" id="siteHeader"></header>

  <main class="main-content tool-page container">
    <div class="breadcrumb">
      <a href="/index.html">首页</a><span>›</span><span>AI取名神器</span>
    </div>

    <div class="tool-header">
      <div class="tool-header-icon" data-icon="name" data-size="64" data-radius="18"></div>
      <h1>AI 取名神器</h1>
      <p>宝宝、宠物、店铺都能取，寓意美好又好听，灵感源源不断</p>
    </div>

    <div class="tool-workspace">
      <div class="panel">
        <h2 class="panel-title"><span class="step-num">1</span>填写信息</h2>

        <div class="form-group">
          <label class="form-label">取名类型</label>
          <div class="chip-group" id="typeChips">
            <span class="chip active" data-value="宝宝">👶 宝宝</span>
            <span class="chip" data-value="宠物">🐱 宠物</span>
            <span class="chip" data-value="店铺">🏪 店铺</span>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="keywordInput">姓氏 / 关键词 <span class="form-hint">选填，如姓氏"李"或喜欢的字"辰"</span></label>
          <input class="input" type="text" id="keywordInput" placeholder="留空则随机生成（选填）">
        </div>

        <div class="form-group">
          <label class="form-label">名字风格</label>
          <div class="chip-group" id="styleChips">
            <span class="chip active" data-value="古风">📜 古风</span>
            <span class="chip" data-value="现代">🌟 现代</span>
            <span class="chip" data-value="可爱">🍬 可爱</span>
            <span class="chip" data-value="大气">🏔️ 大气</span>
          </div>
        </div>

        <button class="btn btn-primary btn-block btn-lg" id="generateBtn" onclick="handleGenerate()">🎋 开始取名</button>
      </div>

      <div class="panel result-panel">
        <h2 class="panel-title"><span class="step-num">2</span>生成结果 <span style="margin-left:auto;font-size:0.8rem;font-weight:400;color:var(--text-light);">点击即可复制</span></h2>
        <div id="resultArea">
          <div class="result-empty">
            <div class="result-empty-icon">🎋</div>
            <p>填写信息并点击生成<br>好名字会出现在这里</p>
          </div>
        </div>
        <div class="result-actions" id="resultActions" style="display:none;">
          <button class="btn btn-outline" onclick="copyAll()">📋 复制全部</button>
          <button class="btn btn-ghost" onclick="handleGenerate()">🔄 换一批</button>
        </div>
      </div>
    </div>

    <div class="ad-container">
      <div class="ad-label">广告</div>
      <div class="ad-slot ad-slot-insight">📢 这里插入 Google AdSense 原生广告 / 信息流广告</div>
    </div>

    <section class="history-section" id="historySection">
      <h2 class="section-title" style="font-size:1.3rem;">🕐 最近生成</h2>
      <div class="history-list" id="historyList"></div>
    </section>
  </main>

  <footer class="site-footer" id="siteFooter"></footer>

  <script src="/assets/js/icons.js?v=20261116b"></script>
  <script src="/assets/js/common.js?v=20261116b"></script>
  <script src="/assets/js/ai-engine.js?v=20261116b"></script>
  <script>
    let currentResults = [], currentParams = {};

    function setupChips(containerId) {
      document.querySelectorAll('#' + containerId + ' .chip').forEach(chip => {
        chip.addEventListener('click', function() {
          document.querySelectorAll('#' + containerId + ' .chip').forEach(c => c.classList.remove('active'));
          this.classList.add('active');
        });
      });
    }
    function getSelected(containerId) {
      const el = document.querySelector('#' + containerId + ' .chip.active');
      return el ? el.dataset.value : '';
    }
    setupChips('typeChips');
    setupChips('styleChips');

    let _busy = false;

    async function handleGenerate() {
      if (_busy) return;

      const topicInput = document.getElementById('topicInput') || document.getElementById('workInput') || document.getElementById('keywordInput') || document.getElementById('situationInput');
      const rawVal = topicInput ? topicInput.value.trim() : '';
      // 只有朋友圈/标题/周报/高情商需要非空校验；取名允许为空
      const needInput = false;
      if (needInput && !rawVal) { showToast('请先填写内容'); return; }

      _busy = true;
      const btn = document.getElementById('generateBtn');
      const origHtml = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner" style="width:18px;height:18px;border-width:2px;display:inline-block;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;"></span> 生成中...';

      const resultArea = document.getElementById('resultArea');
      if (resultArea) resultArea.innerHTML = '<div class="loading-wrap"><div class="spinner"></div><p>正在生成，请稍候...</p></div>';
      const actions = document.getElementById('resultActions');
      if (actions) actions.style.display = 'none';

      try {
        currentParams = { type: getSelected('typeChips'), keyword: document.getElementById('keywordInput').value.trim(), style: getSelected('styleChips'), count: 10 };
        currentResults = await generate('name', currentParams);
        renderResults();
        saveHistory('name', currentParams, currentResults);
        renderHistory('historyList', 'name', restoreHistory);
      } catch (e) {
        showToast('生成失败，请重试');
        console.error(e);
        if (resultArea) resultArea.innerHTML = '<div class="result-empty"><div class="result-empty-icon">😕</div><p>生成失败，请点击重试</p></div>';
      } finally {
        btn.disabled = false;
        btn.innerHTML = '🎋 开始取名';
        _busy = false;
      }
    }

    function renderResults() {
      document.getElementById('resultArea').innerHTML = `
        <div class="result-list">
          ${currentResults.map((text, i) => `
            <div class="result-item" onclick="copyResult(${i}, this)">
              <span class="result-index">${i + 1}</span>
              <p class="result-text">${escapeHtml(text)}</p>
              <span class="result-copy-hint">📋 点击复制</span>
            </div>
          `).join('')}
        </div>`;
      document.getElementById('resultActions').style.display = 'flex';
    }

    async function copyResult(i, el) { await copyText(currentResults[i]); el.classList.add('copied'); setTimeout(() => el.classList.remove('copied'), 800); }
    async function copyAll() { await copyText(currentResults.join('\n')); }

    function restoreHistory(record) {
      document.getElementById('keywordInput').value = record.inputs.keyword || '';
      ['typeChips', 'styleChips'].forEach(id => {
        const key = id === 'typeChips' ? 'type' : 'style';
        document.querySelectorAll('#' + id + ' .chip').forEach(c => c.classList.toggle('active', c.dataset.value === record.inputs[key]));
      });
      currentParams = record.inputs;
      currentResults = record.results;
      renderResults();
      showToast('已恢复历史记录');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.addEventListener('DOMContentLoaded', () => renderHistory('historyList', 'name', restoreHistory));
    // 输入框 Ctrl/Cmd + Enter 快速生成
    document.addEventListener('keydown', function(e){
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); handleGenerate(); }
    });
  </script>
</body>
</html>

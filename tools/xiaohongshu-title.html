<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小红书爆款标题生成器 - 一键生成高点击率标题 | 灵感岛</title>
  <meta name="description" content="免费小红书爆款标题生成器，套用爆款公式批量生成高点击率的小红书笔记标题，让你的笔记流量翻倍。">
  <meta name="keywords" content="小红书标题,小红书爆款标题,爆款标题生成,小红书标题生成器,笔记标题">
  <link rel="canonical" href="/tools/xiaohongshu-title.html">
  <link rel="stylesheet" href="/assets/css/style.css">
  <script type="application/ld+json">
  {"@context":"https://schema.org","@type":"SoftwareApplication","name":"小红书爆款标题生成器","applicationCategory":"UtilitiesApplication","operatingSystem":"Web","offers":{"@type":"Offer","price":"0"}}
  </script>
</head>
<body data-tool="xiaohongshu-title">
  <header class="site-header" id="siteHeader"></header>

  <main class="main-content tool-page container">
    <div class="breadcrumb">
      <a href="/index.html">首页</a><span>›</span><span>小红书爆款标题</span>
    </div>

    <div class="tool-header">
      <div class="tool-header-icon" style="background:#fee2e2;">🔥</div>
      <h1>小红书爆款标题生成器</h1>
      <p>套用爆款公式，批量生成高点击率标题，让笔记流量翻倍</p>
    </div>

    <div class="tool-workspace">
      <div class="panel">
        <h2 class="panel-title"><span class="step-num">1</span>填写内容</h2>

        <div class="form-group">
          <label class="form-label" for="topicInput">笔记主题 / 关键词 <span class="form-hint">如：早八穿搭、平价防晒、租房改造</span></label>
          <input class="input" type="text" id="topicInput" placeholder="输入你的笔记主题..." value="早八穿搭">
        </div>

        <div class="form-group">
          <label class="form-label" for="countSelect">生成数量</label>
          <select class="select" id="countSelect">
            <option value="5">5 条</option>
            <option value="10" selected>10 条</option>
            <option value="15">15 条</option>
            <option value="20">20 条</option>
          </select>
        </div>

        <div style="background:var(--bg-soft);border-radius:var(--radius-sm);padding:14px 16px;margin-bottom:20px;font-size:0.82rem;color:var(--text-sub);line-height:1.7;">
          💡 <strong>爆款小贴士：</strong>标题中多用数字、情绪词和 emoji，能显著提升点击率。生成后可手动微调。
        </div>

        <button class="btn btn-primary btn-block btn-lg" id="generateBtn" onclick="handleGenerate()">🔥 生成爆款标题</button>
      </div>

      <div class="panel result-panel">
        <h2 class="panel-title"><span class="step-num">2</span>生成结果 <span style="margin-left:auto;font-size:0.8rem;font-weight:400;color:var(--text-light);">点击即可复制</span></h2>
        <div id="resultArea">
          <div class="result-empty">
            <div class="result-empty-icon">🔥</div>
            <p>填写主题并点击生成<br>爆款标题会出现在这里</p>
          </div>
        </div>
        <div class="result-actions" id="resultActions" style="display:none;">
          <button class="btn btn-outline" onclick="copyAll()">📋 复制全部</button>
          <button class="btn btn-ghost" onclick="handleGenerate()">🔄 换一批</button>
        </div>
      </div>
    </div>

    <div class="ad-container">
      <div class="ad-label">广告</div>
      <div class="ad-slot ad-slot-insight">📢 这里插入 Google AdSense 原生广告 / 信息流广告</div>
    </div>

    <section class="history-section" id="historySection">
      <h2 class="section-title" style="font-size:1.3rem;">🕐 最近生成</h2>
      <div class="history-list" id="historyList"></div>
    </section>
  </main>

  <footer class="site-footer" id="siteFooter"></footer>

  <script src="/assets/js/common.js"></script>
  <script src="/assets/js/ai-engine.js"></script>
  <script>
    let currentResults = [], currentParams = {};

    async function handleGenerate() {
      const topic = document.getElementById('topicInput').value.trim();
      if (!topic) { showToast('请先填写笔记主题'); return; }
      const count = parseInt(document.getElementById('countSelect').value);

      const btn = document.getElementById('generateBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner" style="width:18px;height:18px;border-width:2px;"></span> 生成中...';
      document.getElementById('resultArea').innerHTML = `<div class="loading-wrap"><div class="spinner"></div><p>正在生成爆款标题...</p></div>`;
      document.getElementById('resultActions').style.display = 'none';

      try {
        currentParams = { topic, count };
        currentResults = await generate('xiaohongshu-title', currentParams);
        renderResults();
        saveHistory('xiaohongshu-title', currentParams, currentResults);
        renderHistory('historyList', 'xiaohongshu-title', restoreHistory);
      } catch (e) {
        showToast('生成失败，请重试'); console.error(e);
      } finally {
        btn.disabled = false;
        btn.innerHTML = '🔥 生成爆款标题';
      }
    }

    function renderResults() {
      document.getElementById('resultArea').innerHTML = `
        <div class="result-list">
          ${currentResults.map((text, i) => `
            <div class="result-item" onclick="copyResult(${i}, this)">
              <span class="result-index">${i + 1}</span>
              <p class="result-text">${escapeHtml(text)}</p>
              <span class="result-copy-hint">📋 点击复制</span>
            </div>
          `).join('')}
        </div>`;
      document.getElementById('resultActions').style.display = 'flex';
    }

    async function copyResult(i, el) { await copyText(currentResults[i]); el.classList.add('copied'); setTimeout(() => el.classList.remove('copied'), 800); }
    async function copyAll() { await copyText(currentResults.join('\n')); }

    function restoreHistory(record) {
      document.getElementById('topicInput').value = record.inputs.topic || '';
      document.getElementById('countSelect').value = record.inputs.count || 10;
      currentParams = record.inputs;
      currentResults = record.results;
      renderResults();
      showToast('已恢复历史记录');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.addEventListener('DOMContentLoaded', () => renderHistory('historyList', 'xiaohongshu-title', restoreHistory));
  </script>
</body>
</html>
